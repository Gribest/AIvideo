<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Tres Leches Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Lobster"; src: url("assets/fonts/Lobster-Regular.ttf"); }
      @font-face { font-family: "Caveat Brush"; src: url("assets/fonts/CaveatBrush-Regular.ttf"); }
      :root { --fill: #9BE15D; --fill2: #D9FF8A; --edge: #123B0C; --dark: #10140a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
      #cam { position: absolute; inset: 0; transform-origin: 45% 62%; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* Title block: same build as the reference (bold script + handwritten line), green instead of purple. */
      #title { position: absolute; left: 0; top: 330px; width: 1080px; height: 330px; z-index: 50; }
      .tin { position: absolute; inset: 0; transform: rotate(-3deg); }
      .t1 { position: absolute; left: 0; width: 1080px; top: 0; text-align: center; font-family: "Lobster", cursive; font-size: 142px; line-height: 1;
        letter-spacing: -0.01em; color: var(--fill);
        background: linear-gradient(180deg, var(--fill2) 0%, var(--fill) 55%, #6CC23A 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0; filter: drop-shadow(0 0 0 var(--edge)) drop-shadow(5px 0 0 var(--edge)) drop-shadow(-5px 0 0 var(--edge)) drop-shadow(0 5px 0 var(--edge)) drop-shadow(0 -5px 0 var(--edge)) drop-shadow(6px 9px 0 var(--edge)); }
      .t2 { position: absolute; left: 0; width: 1080px; top: 122px; text-align: center; font-family: "Caveat Brush", cursive; font-size: 158px; line-height: 1;
        color: #fff; -webkit-text-stroke: 12px #0b0b0b; paint-order: stroke fill; text-shadow: 4px 6px 0 rgba(0,0,0,0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.2" data-width="1080" data-height="1920">
      <div id="cam"><video id="clip" class="clip shot" src="assets/shots/full.mp4" data-start="0" data-duration="19.2" data-track-index="0" muted playsinline></video></div>
      <div id="title" class="clip" data-start="0" data-duration="19.2" data-track-index="1" data-track-kind="graphics">
        <div class="tin"><div class="t1">Viral Tres leches</div><div class="t2">Amsterdam</div></div>
      </div>
      <audio id="orig" class="clip" src="assets/audio/original.wav" data-start="0" data-duration="19.2" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // gentle push-in while the slice comes out, then back out for the hand-over
      tl.to("#cam", { scale: 1.14, duration: 2.2, ease: "power2.inOut" }, 8.6);
      tl.to("#cam", { scale: 1.0, duration: 1.2, ease: "power2.inOut" }, 13.4);
      // lift the title clear of the heads for the last part of the clip
      tl.to("#title", { y: -150, duration: 0.8, ease: "power2.inOut" }, 8.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
